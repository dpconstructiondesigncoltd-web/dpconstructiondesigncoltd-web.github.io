<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DP Construction Design — thoughtful, enduring spaces from concept to completion."
    />
    <meta name="theme-color" content="#191a15" />
    <title>DP Construction Design</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #191a15;
        color: #f5f0e7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
      }

      body {
        min-height: 100svh;
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        isolation: isolate;
      }

      .hero__media,
      .hero__shade {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hero__media {
        z-index: -2;
        object-fit: cover;
        object-position: center;
      }

      .hero__shade {
        z-index: -1;
        background: rgb(12 13 10 / 48%);
      }

      .shell {
        width: min(100% - 48px, 1240px);
        margin-inline: auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-block: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        color: inherit;
        text-decoration: none;
      }

      .brand__mark {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2rem;
        line-height: 1;
      }

      .brand__name,
      .eyebrow,
      .status {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .topbar__label {
        font-size: 0.82rem;
        color: rgb(245 240 231 / 76%);
      }

      .content {
        display: flex;
        align-items: end;
        padding-block: clamp(72px, 13vh, 148px);
      }

      .content__inner {
        max-width: 720px;
      }

      .eyebrow {
        margin: 0 0 22px;
        color: #e1bb7e;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.2rem, 7.4vw, 7.6rem);
        font-weight: 400;
        line-height: 0.96;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      .description {
        max-width: 48ch;
        margin: 28px 0 0;
        color: rgb(245 240 231 / 84%);
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        line-height: 1.7;
      }

      .status {
        align-self: end;
        padding-bottom: 30px;
        color: rgb(245 240 231 / 68%);
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 32px, 1240px);
        }

        .topbar {
          padding-block: 22px;
        }

        .brand__name,
        .topbar__label {
          display: none;
        }

        .content {
          padding-block: 64px;
        }

        .hero__media {
          object-position: 58% center;
        }

        .hero__shade {
          background: rgb(12 13 10 / 58%);
        }

        h1 {
          font-size: clamp(3.25rem, 17vw, 5rem);
        }

        .description {
          line-height: 1.6;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <img
        class="hero__media"
        src="./public/assets/hero-villa.webp"
        alt="Contemporary home surrounded by nature"
      />
      <div class="hero__shade" aria-hidden="true"></div>

      <header class="topbar shell">
        <a class="brand" href="/" aria-label="DP Construction Design — Home">
          <span class="brand__mark">DP</span>
          <span class="brand__name">Construction Design</span>
        </a>
        <span class="topbar__label">Design &amp; Construction</span>
      </header>

      <section class="content shell" aria-labelledby="page-title">
        <div class="content__inner">
          <p class="eyebrow">DP Construction Design</p>
          <h1 id="page-title">Living spaces, thoughtfully made.</h1>
          <p class="description">
            From first idea to finished build — considered, refined, and made to last.
          </p>
        </div>
      </section>

      <p class="status shell">Official website</p>
    </main>
  </body>
</html>
